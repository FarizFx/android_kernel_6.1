name: Build Kernel (GZVM enabled)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force --all
          df -h

      - name: Checkout kernel (kbase)
        uses: actions/checkout@v4
        with:
          repository: mt6897-devs/android_kernel_6.1
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      - name: Checkout device modules (kernelsrc)
        uses: actions/checkout@v4
        with:
          repository: mt6897-devs/android_kernel_device_modules_6.1
          ref: lineage-23.2
          path: device_modules
          fetch-depth: 1

      - name: Setup toolchain (AOSP clang r487747c)
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/toolchain
          git clone --depth=1 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git ${GITHUB_WORKSPACE}/toolchain/clang || \
          curl -LSs -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2023/clang-r487747c.tar.gz" && \
          mkdir -p ${GITHUB_WORKSPACE}/toolchain/clang && tar -xzf clang.tar.gz -C ${GITHUB_WORKSPACE}/toolchain/clang
          ls ${GITHUB_WORKSPACE}/toolchain/clang/bin/ | head

      - name: Build kernel Image
        working-directory: kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1 LLVM_IAS=1
          make O=out mgk_64_k61_defconfig
          make -j$(nproc) O=out Image.gz dtbs 2>&1 | tail -30
          ls -la out/arch/arm64/boot/

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-gzvm
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dts/mediatek/
          if-no-files-found: error
